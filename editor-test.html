
<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171923">
<title>My Character Studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171923;color:#eee;font-family:system-ui,sans-serif}
button,input,select{font:inherit}
button{background:#303544;color:#fff;border:1px solid #454d60;border-radius:8px;padding:9px 10px;cursor:pointer}
button:active{background:#52658a}
button:disabled{opacity:.4}
input,select{background:#202431;color:#fff;border:1px solid #454d60;border-radius:7px;padding:7px;min-width:0}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#202431;border-bottom:1px solid #353b4b;font-weight:700}
#status{font-size:11px;color:#aeb8cc;font-weight:400}
#workspace{position:relative;flex:1;min-height:100px;overflow:hidden}
#view{width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:10px;top:10px;background:#171923bb;padding:7px 9px;border-radius:7px;font-size:11px;color:#d2d7e3;pointer-events:none}
#panel{flex-shrink:0;max-height:48%;overflow:auto;background:#202431;border-top:1px solid #3b4253;padding:10px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.section{border:1px solid #3b4253;border-radius:10px;padding:9px;margin-bottom:9px}
h3{font-size:13px;margin:0 0 8px;color:#c9d5ee}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.row:last-child{margin-bottom:0}
.row button{flex:1}
.field{display:flex;align-items:center;gap:5px;flex:1;min-width:75px;font-size:11px;color:#bdc6d8}
.field span{width:15px;flex-shrink:0}
.field input{width:100%}
#objectList{display:flex;flex-wrap:wrap;gap:5px;max-height:90px;overflow:auto}
.objectItem{font-size:12px;padding:6px 8px}
.objectItem.active{background:#4264a5;border-color:#91b5ff}
.small{font-size:11px;color:#aeb8cc;line-height:1.5}
.danger{background:#58333c}
#colorInput{width:42px;height:34px;padding:2px}
#fileInput{display:none}
@media(min-width:700px){
 #app{flex-direction:row;flex-wrap:wrap}
 header{width:100%}
 #workspace{height:calc(100% - 46px);flex:1}
 #panel{width:340px;max-height:calc(100% - 46px);height:calc(100% - 46px);border-top:0;border-left:1px solid #3b4253}
}
</style>
</head>
<body>
<div id="app">
<header>
 <span>My Character Studio</span>
 <span id="status">準備完了</span>
</header>

<main id="workspace">
 <canvas id="view"></canvas>
 <div id="hint">空の作業スペース<br>ドラッグ：視点移動 ／ ピンチ：拡大縮小<br>パーツを追加してキャラクターを作ろう</div>
</main>

<section id="panel">
 <div class="section">
  <h3>① パーツを追加</h3>
  <div class="row">
   <button data-add="sphere">● 球</button>
   <button data-add="box">■ 箱</button>
   <button data-add="cylinder">▰ 円柱</button>
  </div>
  <div class="row">
   <button data-add="cone">▲ 円錐</button>
   <button data-add="torus">◎ 輪</button>
   <button id="duplicate">複製</button>
  </div>
  <div class="small">追加したパーツは自由に移動・回転・拡大縮小できるよ。</div>
 </div>

 <div class="section">
  <h3>② パーツ一覧</h3>
  <div id="objectList" class="small">まだパーツがありません</div>
  <div class="row" style="margin-top:8px">
   <button id="undo">↶ 取り消し</button>
   <button id="delete" class="danger">削除</button>
   <button id="clear">全消去</button>
  </div>
 </div>

 <div class="section">
  <h3>③ 選択パーツの位置</h3>
  <div class="row">
   <label class="field"><span>X</span><input id="px" type="number" step="0.1" value="0"></label>
   <label class="field"><span>Y</span><input id="py" type="number" step="0.1" value="0"></label>
   <label class="field"><span>Z</span><input id="pz" type="number" step="0.1" value="0"></label>
  </div>
  <h3>回転（度）</h3>
  <div class="row">
   <label class="field"><span>X</span><input id="rx" type="number" step="5" value="0"></label>
   <label class="field"><span>Y</span><input id="ry" type="number" step="5" value="0"></label>
   <label class="field"><span>Z</span><input id="rz" type="number" step="5" value="0"></label>
  </div>
  <h3>大きさ</h3>
  <div class="row">
   <label class="field"><span>X</span><input id="sx" type="number" min="0.05" step="0.1" value="1"></label>
   <label class="field"><span>Y</span><input id="sy" type="number" min="0.05" step="0.1" value="1"></label>
   <label class="field"><span>Z</span><input id="sz" type="number" min="0.05" step="0.1" value="1"></label>
  </div>
  <div class="row">
   <label class="field" style="flex:0 0 auto">色</label>
   <input id="colorInput" type="color" value="#7c91d9">
   <button id="applyColor">色を適用</button>
  </div>
 </div>

 <div class="section">
  <h3>④ 参考画像</h3>
  <div class="row">
   <button id="loadImage">画像を読み込む</button>
   <button id="toggleImage">表示切替</button>
   <button id="removeImage" class="danger">画像を削除</button>
   <input id="fileInput" type="file" accept="image/*">
  </div>
  <div class="small">正面の参考画像を作業空間の奥に表示するよ。</div>
 </div>

 <div class="section">
  <h3>⑤ 表示設定</h3>
  <div class="row">
   <button id="front">正面</button>
   <button id="side">横</button>
   <button id="resetView">視点リセット</button>
  </div>
  <div class="row">
   <button id="gridToggle">床グリッド切替</button>
  </div>
  <div class="small">この版ではパーツの組み立て・基本編集・取り消しを実装。関節の親子付けや滑らかなスキニングはまだ未実装だよ。</div>
 </div>
</section>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const canvas = $('view');

const scene = new THREE.Scene();
scene.background = new THREE.Color('#171923');

const camera = new THREE.PerspectiveCamera(45,1,0.01,1000);
camera.position.set(5,4,7);

const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.target.set(0,1,0);
controls.minDistance = 1;
controls.maxDistance = 50;

scene.add(new THREE.HemisphereLight(0xffffff,0x55566b,2));

const light = new THREE.DirectionalLight(0xffffff,2.3);
light.position.set(4,8,6);
light.castShadow = true;
scene.add(light);

const grid = new THREE.GridHelper(20,20,0x59657e,0x303746);
scene.add(grid);

const floor = new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x202431,roughness:1})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-0.015;
floor.receiveShadow=true;
scene.add(floor);

const axes = new THREE.AxesHelper(1.5);
scene.add(axes);

let objects=[];
let selected=null;
let nextId=1;
let history=[];
let referencePlane=null;
let referenceTexture=null;
let referenceVisible=true;

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function say(message){
 $('status').textContent=message;
}

function makeGeometry(type){
 switch(type){
  case 'sphere': return new THREE.SphereGeometry(0.5,24,16);
  case 'box': return new THREE.BoxGeometry(1,1,1);
  case 'cylinder': return new THREE.CylinderGeometry(0.5,0.5,1,24);
  case 'cone': return new THREE.ConeGeometry(0.5,1,24);
  case 'torus': return new THREE.TorusGeometry(0.38,0.12,12,32);
  default: return new THREE.BoxGeometry(1,1,1);
 }
}

const typeNames={
 sphere:'球',box:'箱',cylinder:'円柱',cone:'円錐',torus:'輪'
};

function createObject(type,data={}){
 const material=new THREE.MeshStandardMaterial({
  color:data.color || '#7c91d9',
  roughness:0.65,
  metalness:0.02
 });
 const mesh=new THREE.Mesh(makeGeometry(type),material);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 mesh.userData.id=data.id ?? nextId++;
 mesh.userData.type=type;
 mesh.userData.label=data.label || typeNames[type]+' '+mesh.userData.id;
 mesh.position.fromArray(data.position || [0,0,0]);
 mesh.rotation.set(...(data.rotation || [0,0,0]));
 mesh.scale.fromArray(data.scale || [1,1,1]);
 scene.add(mesh);
 objects.push(mesh);
 return mesh;
}

function objectData(o){
 return {
  id:o.userData.id,
  type:o.userData.type,
  label:o.userData.label,
  color:'#'+o.material.color.getHexString(),
  position:o.position.toArray(),
  rotation:[o.rotation.x,o.rotation.y,o.rotation.z],
  scale:o.scale.toArray()
 };
}

function saveHistory(){
 history.push({
  objects:objects.map(objectData),
  selectedId:selected?.userData.id ?? null
 });
 if(history.length>40) history.shift();
 $('undo').disabled=history.length===0;
}

function restoreHistory(){
 if(!history.length) return;
 const state=history.pop();
 for(const o of objects){
  scene.remove(o);
  o.geometry.dispose();
  o.material.dispose();
 }
 objects=[];
 selected=null;
 for(const d of state.objects) createObject(d.type,d);
 selected=objects.find(o=>o.userData.id===state.selectedId) || null;
 refreshList();
 syncFields();
 updateSelectionAppearance();
 $('undo').disabled=history.length===0;
 say('ひとつ前に戻したよ');
}

function selectObject(o){
 selected=o;
 refreshList();
 syncFields();
 updateSelectionAppearance();
 if(o) say(o.userData.label+' を選択中');
 else say('パーツを選択してね');
}

function updateSelectionAppearance(){
 for(const o of objects){
  o.material.emissive.set(o===selected ? '#25213c' : '#000000');
 }
}

function refreshList(){
 const list=$('objectList');
 list.replaceChildren();
 if(!objects.length){
  list.textContent='まだパーツがありません';
  return;
 }
 for(const o of objects){
  const b=document.createElement('button');
  b.className='objectItem'+(o===selected?' active':'');
  b.textContent=(o===selected?'✓ ':'')+o.userData.label;
  b.addEventListener('click',()=>selectObject(o));
  list.appendChild(b);
 }
}

function syncFields(){
 const fields={
  px:selected?.position.x ?? 0,
  py:selected?.position.y ?? 0,
  pz:selected?.position.z ?? 0,
  rx:selected?THREE.MathUtils.radToDeg(selected.rotation.x):0,
  ry:selected?THREE.MathUtils.radToDeg(selected.rotation.y):0,
  rz:selected?THREE.MathUtils.radToDeg(selected.rotation.z):0,
  sx:selected?.scale.x ?? 1,
  sy:selected?.scale.y ?? 1,
  sz:selected?.scale.z ?? 1
 };
 for(const [id,value] of Object.entries(fields)){
  $(id).value=Number(value.toFixed(3));
 }
 if(selected) $('colorInput').value='#'+selected.material.color.getHexString();
}

function addObject(type){
 saveHistory();
 const mesh=createObject(type);
 selectObject(mesh);
 say(typeNames[type]+'を追加したよ');
}

document.querySelectorAll('[data-add]').forEach(button=>{
 button.addEventListener('click',()=>addObject(button.dataset.add));
});

function applyTransform(){
 if(!selected) return;
 const n=id=>Number($(id).value)||0;
 selected.position.set(n('px'),n('py'),n('pz'));
 selected.rotation.set(
  THREE.MathUtils.degToRad(n('rx')),
  THREE.MathUtils.degToRad(n('ry')),
  THREE.MathUtils.degToRad(n('rz'))
 );
 selected.scale.set(
  Math.max(0.05,n('sx')),
  Math.max(0.05,n('sy')),
  Math.max(0.05,n('sz'))
 );
}

const transformInputs=['px','py','pz','rx','ry','rz','sx','sy','sz'];
transformInputs.forEach(id=>{
 $(id).addEventListener('change',()=>{
  if(!selected) return;
  saveHistory();
  applyTransform();
  say('パーツを編集したよ');
 });
});

$('applyColor').addEventListener('click',()=>{
 if(!selected) return say('先にパーツを選択してね');
 saveHistory();
 selected.material.color.set($('colorInput').value);
 say('色を変更したよ');
});

$('colorInput').addEventListener('change',()=>{
 if(!selected) return;
 saveHistory();
 selected.material.color.set($('colorInput').value);
});

$('duplicate').addEventListener('click',()=>{
 if(!selected) return say('複製するパーツを選択してね');
 saveHistory();
 const d=objectData(selected);
 d.id=undefined;
 d.label=typeNames[d.type]+' '+nextId;
 d.position=[d.position[0]+0.35,d.position[1]+0.2,d.position[2]];
 const copy=createObject(d.type,d);
 selectObject(copy);
 say('パーツを複製したよ');
});

$('delete').addEventListener('click',()=>{
 if(!selected) return say('削除するパーツを選択してね');
 saveHistory();
 const old=selected;
 scene.remove(old);
 objects=objects.filter(o=>o!==old);
 old.geometry.dispose();
 old.material.dispose();
 selected=null;
 refreshList();
 syncFields();
 updateSelectionAppearance();
 say('パーツを削除したよ');
});

$('clear').addEventListener('click',()=>{
 if(!objects.length) return say('消すパーツがないよ');
 saveHistory();
 for(const o of objects){
  scene.remove(o);
  o.geometry.dispose();
  o.material.dispose();
 }
 objects=[];
 selected=null;
 refreshList();
 syncFields();
 updateSelectionAppearance();
 say('パーツをすべて消したよ');
});

$('undo').addEventListener('click',restoreHistory);
$('undo').disabled=true;

canvas.addEventListener('pointerdown',event=>{
 const rect=canvas.getBoundingClientRect();
 pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(objects,false);
 if(hits.length) selectObject(hits[0].object);
});

$('front').addEventListener('click',()=>{
 camera.position.set(0,1.5,9);
 controls.target.set(0,1,0);
 controls.update();
});

$('side').addEventListener('click',()=>{
 camera.position.set(9,1.5,0);
 controls.target.set(0,1,0);
 controls.update();
});

$('resetView').addEventListener('click',()=>{
 camera.position.set(5,4,7);
 controls.target.set(0,1,0);
 controls.update();
});

$('gridToggle').addEventListener('click',()=>{
 grid.visible=!grid.visible;
 say(grid.visible?'床グリッドを表示':'床グリッドを非表示');
});

$('loadImage').addEventListener('click',()=>$('fileInput').click());

$('fileInput').addEventListener('change',event=>{
 const file=event.target.files?.[0];
 if(!file) return;
 const url=URL.createObjectURL(file);
 const image=new Image();
 image.onload=()=>{
  if(referencePlane){
   scene.remove(referencePlane);
   referencePlane.geometry.dispose();
   referencePlane.material.dispose();
  }
  if(referenceTexture) referenceTexture.dispose();

  referenceTexture=new THREE.Texture(image);
  referenceTexture.colorSpace=THREE.SRGBColorSpace;
  referenceTexture.needsUpdate=true;

  const aspect=image.width/image.height;
  const height=3;
  const width=height*aspect;
  const material=new THREE.MeshBasicMaterial({
   map:referenceTexture,
   transparent:true,
   opacity:0.8,
   side:THREE.DoubleSide,
   depthWrite:false
  });
  referencePlane=new THREE.Mesh(
   new THREE.PlaneGeometry(width,height),material
  );
  referencePlane.position.set(0,1.5,-1.5);
  referencePlane.renderOrder=-1;
  scene.add(referencePlane);
  referenceVisible=true;
  referencePlane.visible=true;
  URL.revokeObjectURL(url);
  say('参考画像を読み込んだよ');
 };
 image.onerror=()=>{
  URL.revokeObjectURL(url);
  say('画像を読み込めなかったよ');
 };
 image.src=url;
 event.target.value='';
});

$('toggleImage').addEventListener('click',()=>{
 if(!referencePlane) return say('先に参考画像を読み込んでね');
 referenceVisible=!referenceVisible;
 referencePlane.visible=referenceVisible;
 say(referenceVisible?'参考画像を表示':'参考画像を非表示');
});

$('removeImage').addEventListener('click',()=>{
 if(!referencePlane) return say('参考画像はまだないよ');
 scene.remove(referencePlane);
 referencePlane.geometry.dispose();
 referencePlane.material.dispose();
 referencePlane=null;
 if(referenceTexture) referenceTexture.dispose();
 referenceTexture=null;
 say('参考画像を削除したよ');
});

function resize(){
 const width=canvas.clientWidth;
 const height=canvas.clientHeight;
 if(!width||!height) return;
 renderer.setSize(width,height,false);
 camera.aspect=width/height;
 camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($('workspace'));
resize();

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

refreshList();
syncFields();
say('空の作業スペース');
</script>
</body>
</html>
