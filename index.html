
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Mini Blender VRM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #20232a;
      color: white;
      font-family: sans-serif;
    }
    header {
      padding: 14px;
      background: #303640;
      font-weight: bold;
    }
    #toolbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #5267d9;
      color: white;
      font-size: 14px;
    }
    #viewport {
      height: 65dvh;
      min-height: 300px;
      background: #17191f;
      position: relative;
      overflow: hidden;
    }
    #status { padding: 12px; color: #cbd5e1; }
    
.file-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  border-radius: 8px;
  background: #5267d9;
  color: white;
  font-size: 14px;
  cursor: pointer;
  touch-action: manipulation;
}

#file {
  display: block;
  width: 100%;
  color: white;
  font-size: 14px;
  padding: 8px;
}

  </style>
</head>
<body>
  <header>Mini Blender VRM</header>
  
<div id="toolbar">
  <label for="file" class="file-button">
    VRMを読み込む
  </label>
  <button id="rotate" type="button">
    回転をリセット
  </button>
  <input
    id="file"
    type="file"
    accept=".vrm,model/gltf-binary,application/octet-stream"
　 >
  <p id="debug">ページ起動確認</p>
</div>

  <div id="viewport"></div>
  <div id="status">VRMモデルを読み込んでください。</div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import { GLTFLoader } from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin } from
      'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js';

    const viewport = document.querySelector('#viewport');
    const status = document.querySelector('#status');
　　　
const debugFile = document.querySelector('#file');


const debugFile = document.querySelector('#file');
const debugText = document.querySelector('#debug');

debugText.textContent = '入力欄の監視を開始しました';

debugFile.addEventListener('click', () => {
  debugText.textContent = 'ファイル選択画面を開きました';
});

debugFile.addEventListener('change', () => {
  const file = debugFile.files?.[0];

  debugText.textContent = file
    ? '選択イベント成功：' + file.name
    : 'イベント発生：ファイルは未選択';
});

debugFile.addEventListener('cancel', () => {
  debugText.textContent = 'ファイル選択がキャンセルされました';
});

  document.querySelector('#debug').textContent =
    'ファイル選択イベント成功：' +
    (debugFile.files?.[0]?.name || 'ファイルなし');
});

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x252933);

    const camera = new THREE.PerspectiveCamera(
      35, viewport.clientWidth / viewport.clientHeight,
      0.1, 100
    );
    camera.position.set(0, 1.3, 3.5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true, alpha: false
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    viewport.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 2));
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(1, 3, 4);
    scene.add(light);

    const grid = new THREE.GridHelper(10, 20);
    scene.add(grid);

    let currentVRM = null;

    const loader = new GLTFLoader();
    loader.register(parser => new VRMLoaderPlugin(parser));

    

    
document.querySelector('#file').onchange = async event => {
  const file = event.target.files?.[0];

  if (!file) {
    status.textContent = 'ファイルが選択されていません';
    return;
  }

  status.textContent = 'ファイル選択成功：' + file.name;

  let url = null;

  try {
    status.textContent = 'VRM読み込み中...';

    url = URL.createObjectURL(file);
    const gltf = await loader.loadAsync(url);

    const vrm = gltf.userData.vrm;

    if (!vrm) {
      throw new Error('VRMモデルとして認識できません');
    }

    if (currentVRM) {
      scene.remove(currentVRM.scene);
    }

    currentVRM = vrm;
    scene.add(vrm.scene);

    // モデルの大きさと位置を調べる
    const box = new THREE.Box3().setFromObject(vrm.scene);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    if (size.length() === 0) {
      throw new Error('モデルの大きさを取得できません');
    }

    // モデルの中央にカメラを向ける
    const maxSize = Math.max(size.x, size.y, size.z);
    const distance = maxSize * 2.5;

    camera.position.set(
      center.x,
      center.y,
      center.z + distance
    );

    camera.near = Math.max(maxSize / 1000, 0.001);
    camera.far = Math.max(maxSize * 100, 100);
    camera.updateProjectionMatrix();
    camera.lookAt(center);

    status.textContent = 'VRM読み込み成功！';

  } catch (error) {
    console.error('VRM読み込みエラー:', error);
    status.textContent =
      '読み込み失敗：' + (error.message || error);
  } finally {
    if (url) URL.revokeObjectURL(url);
  }
};

      try {
        const url = URL.createObjectURL(file);
        const gltf = await loader.loadAsync(url);
        URL.revokeObjectURL(url);

        if (!gltf.userData.vrm) {
          throw new Error('VRMとして認識できませんでした');
        }

        if (currentVRM) scene.remove(currentVRM.scene);
        currentVRM = gltf.userData.vrm;
        scene.add(currentVRM.scene);
        status.textContent = 'VRM読み込み成功！';
      } catch (error) {
        status.textContent = '読み込み失敗：' + error.message;
      }
    };

    document.querySelector('#rotate').onclick = () => {
      if (currentVRM) currentVRM.scene.rotation.y = 0;
      camera.position.set(0, 1.3, 3.5);
      camera.lookAt(0, 1, 0);
    };

    function resize() {
      const w = viewport.clientWidth;
      const h = viewport.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    new ResizeObserver(resize).observe(viewport);

    function animate() {
      requestAnimationFrame(animate);
      if (currentVRM) currentVRM.update(1 / 60);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
