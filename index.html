
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171625">
<title>Mini Live2D Studio</title>

<style>
*{box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#171625;
  --panel:#242238;
  --line:#403b59;
  --accent:#c5a5ff;
  --text:#f5f1ff;
  --muted:#b8b2cc;
}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}
header{
  padding:16px;background:#201e31;border-bottom:1px solid var(--line);
}
h1{font-size:21px;margin:0 0 5px}
header p{font-size:12px;color:var(--muted);margin:0}
main{max-width:1000px;margin:auto;padding:12px;display:grid;gap:12px}
.panel{
  border:1px solid var(--line);border-radius:15px;
  background:var(--panel);padding:12px;min-width:0;
}
h2{font-size:15px;margin:0 0 12px}
button,.fileButton{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:42px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:#35304b;color:white;
  font-size:13px;cursor:pointer;touch-action:manipulation;
}
button:active,.fileButton:active{opacity:.75}
button.primary{background:#7254b4;border-color:#9474d5}
button.active{background:#a47ae5;color:#171027}
button.danger{background:#532e43}
input,select{
  max-width:100%;min-height:38px;border-radius:8px;
  border:1px solid var(--line);background:#171625;color:white;
  padding:8px;font-size:14px;
}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
input[type=file]{display:none}
label{font-size:12px;color:var(--muted)}
.field{display:grid;gap:7px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.row .small{flex:0 0 auto}
.workspace{padding:8px;background:#11101a;border-radius:12px;overflow:hidden}
#stage{
  display:block;width:100%;height:auto;max-height:58vh;
  object-fit:contain;touch-action:none;background:
  conic-gradient(#262436 25%,#1e1c2c 0 50%,#262436 0 75%,#1e1c2c 0);
  background-size:20px 20px;border-radius:6px;
}
.hint{font-size:12px;line-height:1.7;color:var(--muted);margin:10px 2px 2px}
.status{font-size:12px;line-height:1.6;color:#d7c5ff;margin-top:10px;white-space:pre-wrap}
#parts{display:grid;gap:7px}
.partItem{
  display:flex;gap:8px;align-items:center;padding:9px;
  border:1px solid var(--line);border-radius:10px;
}
.partItem.selected{border-color:var(--accent);background:#38304d}
.partName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.partItem button{min-height:34px;padding:6px 9px}
.toolGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toolGrid button{width:100%}
.checkRow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:11px;padding:10px 12px 25px}
@media(min-width:760px){
 main{grid-template-columns:minmax(0,1.45fr) minmax(270px,1fr);align-items:start}
 .editor{grid-column:2;grid-row:1}
 .stagePanel{grid-column:1;grid-row:1}
 #stage{max-height:72vh}
}
</style>
</head>

<body>
<header>
  <h1>✦ Mini Live2D Studio</h1>
  <p>2D Character Animation Editor · Prototype 1.0</p>
</header>

<main>
<section class="panel stagePanel">
  <h2>① キャンバス</h2>
  <div class="row">
    <label class="fileButton primary" for="imageFile">画像を読み込む</label>
    <input id="imageFile" type="file" accept="image/*">
    <button id="cropMode" class="small">＋ パーツ切り出し</button>
  </div>

  <div class="workspace" style="margin-top:12px">
    <canvas id="stage" width="600" height="600"></canvas>
  </div>

  <p class="hint" id="canvasHint">
    画像を読み込んでね。パーツ切り出しを押したら、画像上をドラッグして範囲を選択できるよ。
  </p>

  <div class="field">
    <label>表示設定</label>
    <label class="checkRow">
      <input type="checkbox" id="hideBase">
      元画像を隠す（切り出したパーツだけ表示）
    </label>
    <label class="checkRow">
      <input type="checkbox" id="animation">
      アニメーションを再生
    </label>
  </div>

  <div class="row">
    <button id="resetView">位置をリセット</button>
    <button id="downloadImage">PNG画像を書き出す</button>
  </div>
  <div id="status" class="status">画像を読み込んで制作を始めよう。</div>
</section>

<section class="panel editor">
  <h2>② パーツ一覧</h2>
  <div class="row" style="margin-bottom:10px">
    <button id="addCircle">＋ 円形パーツ</button>
    <button id="addRect">＋ 四角パーツ</button>
  </div>
  <div id="parts">
    <p class="hint">まだパーツがないよ。</p>
  </div>

  <div id="partEditor" hidden>
    <h2 style="margin-top:18px">③ 選択パーツの編集</h2>

    <div class="field">
      <label for="partName">パーツ名</label>
      <input id="partName" placeholder="例：前髪">
    </div>

    <div class="field">
      <label for="posX">横位置</label>
      <input id="posX" type="range" min="-300" max="1000" value="0">
    </div>
    <div class="field">
      <label for="posY">縦位置</label>
      <input id="posY" type="range" min="-300" max="1000" value="0">
    </div>
    <div class="field">
      <label for="scale">大きさ</label>
      <input id="scale" type="range" min="20" max="250" value="100">
    </div>
    <div class="field">
      <label for="rotation">回転</label>
      <input id="rotation" type="range" min="-180" max="180" value="0">
    </div>
    <div class="field">
      <label for="sway">揺れの強さ</label>
      <input id="sway" type="range" min="0" max="30" value="8">
    </div>
    <div class="field">
      <label for="speed">揺れの速さ</label>
      <input id="speed" type="range" min="1" max="30" value="10">
    </div>

    <div class="row">
      <button id="togglePart">表示 / 非表示</button>
      <button id="deletePart" class="danger">削除</button>
    </div>
  </div>

  <h2 style="margin-top:20px">④ プロジェクト保存</h2>
  <div class="toolGrid">
    <button id="saveProject" class="primary">制作データを保存</button>
    <label class="fileButton" style="text-align:center" for="loadProject">制作データを開く</label>
    <input id="loadProject" type="file" accept=".json,application/json">
  </div>
  <p class="hint">
    JSONには元画像と切り出したパーツが保存されるよ。保存したファイルは大切に保管してね。
  </p>
</section>
</main>

<footer>Mini Live2D Studio · iPhone Web Prototype</footer>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const stage = $("stage");
const ctx = stage.getContext("2d");
const sourceCanvas = document.createElement("canvas");
const sourceCtx = sourceCanvas.getContext("2d");

let baseImageData = null;
let parts = [];
let selectedId = null;
let nextId = 1;
let cropMode = false;
let pointerStart = null;
let pointerNow = null;
let dragPart = null;
let elapsed = 0;
let lastFrame = 0;

const state = {
  imageName: "",
  hideBase: false,
  animation: false
};

function say(message) {
  $("status").textContent = message;
}

function selectedPart() {
  return parts.find(p => p.id === selectedId) || null;
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function makeId() {
  return nextId++;
}

function readSourceImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("画像を開けなかったよ。"));
    img.src = dataUrl;
  });
}

function canvasToDataURL(canvas) {
  return canvas.toDataURL("image/png");
}

function loadBaseData(dataUrl, name) {
  return readSourceImage(dataUrl).then(img => {
    const maxSide = 1400;
    const factor = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    sourceCanvas.width = Math.max(1, Math.round(img.naturalWidth * factor));
    sourceCanvas.height = Math.max(1, Math.round(img.naturalHeight * factor));
    sourceCtx.clearRect(0, 0, sourceCanvas.width, sourceCanvas.height);
    sourceCtx.drawImage(img, 0, 0, sourceCanvas.width, sourceCanvas.height);

    stage.width = sourceCanvas.width;
    stage.height = sourceCanvas.height;
    baseImageData = canvasToDataURL(sourceCanvas);
    state.imageName = name || "image.png";
    render();
  });
}

$("imageFile").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    say("画像ファイルを選んでね。");
    return;
  }
  try {
    const data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    await loadBaseData(data, file.name);
    parts = [];
    selectedId = null;
    state.hideBase = false;
    $("hideBase").checked = false;
    $("partEditor").hidden = true;
    setCropMode(false);
    updatePartList();
    render();
    say("画像を読み込んだよ。切り出しモードでパーツを作ろう。");
  } catch (err) {
    say("読み込みエラー：" + err.message);
  }
  e.target.value = "";
});

function setCropMode(on) {
  cropMode = on;
  $("cropMode").classList.toggle("active", on);
  $("cropMode").textContent = on ? "切り出し中（範囲を選択）" : "＋ パーツ切り出し";
  $("canvasHint").textContent = on
    ? "画像上で指をドラッグして四角い範囲を選んでね。指を離すとパーツが追加されるよ。"
    : "パーツを直接ドラッグすると位置を動かせるよ。パーツを選んで右側で調整しよう。";
  pointerStart = null;
  pointerNow = null;
  render();
}

$("cropMode").addEventListener("click", () => {
  if (!baseImageData) {
    say("先に画像を読み込んでね。");
    return;
  }
  setCropMode(!cropMode);
});

function pointerPosition(e) {
  const r = stage.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * stage.width / r.width,
    y: (e.clientY - r.top) * stage.height / r.height
  };
}

function hitTest(x, y) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (!p.visible) continue;
    const w = p.w * p.scale;
    const h = p.h * p.scale;
    const cx = p.x + w / 2;
    const cy = p.y + h / 2;
    const a = -(p.rotation * Math.PI / 180);
    const dx = x - cx;
    const dy = y - cy;
    const lx = dx * Math.cos(a) - dy * Math.sin(a) + w / 2;
    const ly = dx * Math.sin(a) + dy * Math.cos(a) + h / 2;
    if (lx >= 0 && ly >= 0 && lx <= w && ly <= h) return p;
  }
  return null;
}

stage.addEventListener("pointerdown", e => {
  if (!baseImageData) return;
  e.preventDefault();
  stage.setPointerCapture(e.pointerId);
  const pt = pointerPosition(e);

  if (cropMode) {
    pointerStart = pt;
    pointerNow = pt;
    render();
    return;
  }

  const p = hitTest(pt.x, pt.y);
  if (p) {
    selectedId = p.id;
    dragPart = { id:p.id, start:pt, x:p.x, y:p.y };
    updatePartList();
    syncEditor();
  } else {
    selectedId = null;
    syncEditor();
    updatePartList();
  }
  render();
});

stage.addEventListener("pointermove", e => {
  const pt = pointerPosition(e);

  if (cropMode && pointerStart) {
    pointerNow = pt;
    render();
    return;
  }

  if (dragPart) {
    const p = parts.find(v => v.id === dragPart.id);
    if (!p) return;
    p.x = dragPart.x + pt.x - dragPart.start.x;
    p.y = dragPart.y + pt.y - dragPart.start.y;
    syncEditor();
    render();
  }
});

stage.addEventListener("pointerup", e => {
  if (cropMode && pointerStart && pointerNow) {
    const x = clamp(Math.min(pointerStart.x, pointerNow.x), 0, stage.width);
    const y = clamp(Math.min(pointerStart.y, pointerNow.y), 0, stage.height);
    const right = clamp(Math.max(pointerStart.x, pointerNow.x), 0, stage.width);
    const bottom = clamp(Math.max(pointerStart.y, pointerNow.y), 0, stage.height);
    const w = Math.floor(right - x);
    const h = Math.floor(bottom - y);

    if (w >= 5 && h >= 5) {
      const patch = document.createElement("canvas");
      patch.width = w;
      patch.height = h;
      patch.getContext("2d").drawImage(sourceCanvas, x, y, w, h, 0, 0, w, h);
      const p = {
        id:makeId(),
        name:"パーツ " + nextId,
        data:canvasToDataURL(patch),
        x,y,w,h,scale:1,rotation:0,sway:8,speed:1,
        visible:true,
        phase:Math.random() * Math.PI * 2
      };
      parts.push(p);
      selectedId = p.id;
      updatePartList();
      syncEditor();
      say("パーツを追加したよ。名前や揺れを編集してね。");
    } else {
      say("選択範囲が小さすぎるよ。もう少し大きく選んでね。");
    }
    pointerStart = null;
    pointerNow = null;
    render();
  }
  dragPart = null;
});

stage.addEventListener("pointercancel", () => {
  pointerStart = null;
  pointerNow = null;
  dragPart = null;
  render();
});

function addShape(shape) {
  if (!baseImageData) {
    say("先に画像を読み込んでね。");
    return;
  }
  const w = Math.round(stage.width * 0.15);
  const h = shape === "circle" ? w : Math.round(stage.height * 0.12);
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  const cctx = c.getContext("2d");
  cctx.fillStyle = "#c5a5ff";
  cctx.strokeStyle = "#fff";
  cctx.lineWidth = Math.max(2, w * 0.025);
  if (shape === "circle") {
    cctx.beginPath();
    cctx.ellipse(w/2,h/2,w/2-2,h/2-2,0,0,Math.PI*2);
    cctx.fill();
    cctx.stroke();
  } else {
    cctx.fillRect(2,2,w-4,h-4);
    cctx.strokeRect(2,2,w-4,h-4);
  }
  const p = {
    id:makeId(),
    name:shape === "circle" ? "円形パーツ" : "四角パーツ",
    data:canvasToDataURL(c),
    x:(stage.width-w)/2,y:(stage.height-h)/2,w,h,
    scale:1,rotation:0,sway:8,speed:1,
    visible:true,phase:Math.random()*Math.PI*2
  };
  parts.push(p);
  selectedId = p.id;
  updatePartList();
  syncEditor();
  render();
  say("図形パーツを追加したよ。");
}
$("addCircle").addEventListener("click", () => addShape("circle"));
$("addRect").addEventListener("click", () => addShape("rect"));

function updatePartList() {
  const root = $("parts");
  root.innerHTML = "";
  if (!parts.length) {
    const p = document.createElement("p");
    p.className = "hint";
    p.textContent = "まだパーツがないよ。画像から切り出すか、図形を追加してね。";
    root.appendChild(p);
    return;
  }

  parts.forEach(p => {
    const row = document.createElement("div");
    row.className = "partItem" + (p.id === selectedId ? " selected" : "");

    const select = document.createElement("button");
    select.className = "partName";
    select.textContent = p.name;
    select.addEventListener("click", () => {
      selectedId = p.id;
      updatePartList();
      syncEditor();
      render();
    });

    const visibility = document.createElement("button");
    visibility.textContent = p.visible ? "表示" : "非表示";
    visibility.addEventListener("click", () => {
      p.visible = !p.visible;
      updatePartList();
      syncEditor();
      render();
    });

    row.append(select, visibility);
    root.appendChild(row);
  });
}

function syncEditor() {
  const p = selectedPart();
  $("partEditor").hidden = !p;
  if (!p) return;
  $("partName").value = p.name;
  $("posX").value = clamp(p.x, -300, 1000);
  $("posY").value = clamp(p.y, -300, 1000);
  $("scale").value = Math.round(p.scale * 100);
  $("rotation").value = p.rotation;
  $("sway").value = p.sway;
  $("speed").value = Math.round(p.speed * 10);
  $("togglePart").textContent = p.visible ? "非表示にする" : "表示する";
}

$("partName").addEventListener("input", () => {
  const p = selectedPart();
  if (!p) return;
  p.name = $("partName").value;
  updatePartList();
});

[
  ["posX","x",v=>Number(v)],
  ["posY","y",v=>Number(v)],
  ["scale","scale",v=>Number(v)/100],
  ["rotation","rotation",v=>Number(v)],
  ["sway","sway",v=>Number(v)],
  ["speed","speed",v=>Number(v)/10]
].forEach(([id,key,convert]) => {
  $(id).addEventListener("input", () => {
    const p = selectedPart();
    if (!p) return;
    p[key] = convert($(id).value);
    render();
  });
});

$("togglePart").addEventListener("click", () => {
  const p = selectedPart();
  if (!p) return;
  p.visible = !p.visible;
  updatePartList();
  syncEditor();
  render();
});

$("deletePart").addEventListener("click", () => {
  if (!selectedPart()) return;
  parts = parts.filter(p => p.id !== selectedId);
  selectedId = null;
  updatePartList();
  syncEditor();
  render();
  say("パーツを削除したよ。");
});

$("hideBase").addEventListener("change", e => {
  state.hideBase = e.target.checked;
  render();
});
$("animation").addEventListener("change", e => {
  state.animation = e.target.checked;
  if (state.animation) say("アニメーション再生中。");
  render();
});
$("resetView").addEventListener("click", () => {
  parts.forEach(p => {
    p.scale = 1;
    p.rotation = 0;
    p.sway = 8;
  });
  syncEditor();
  render();
  say("大きさ・回転・揺れを初期値に戻したよ。位置はそのままだよ。");
});

function render() {
  ctx.clearRect(0, 0, stage.width, stage.height);

  if (baseImageData && !state.hideBase) {
    ctx.drawImage(sourceCanvas, 0, 0);
  }

  for (const p of parts) {
    if (!p.visible) continue;

    if (!p.image) {
      p.image = new Image();
      p.image.src = p.data;
    }
    if (!p.image.complete || !p.image.naturalWidth) continue;

    const w = p.w * p.scale;
    const h = p.h * p.scale;
    let swayX = 0, swayY = 0, swayR = 0;

    if (state.animation) {
      const t = elapsed * p.speed + p.phase;
      swayX = Math.sin(t) * p.sway;
      swayY = Math.cos(t * 0.7) * p.sway * 0.35;
      swayR = Math.sin(t * 0.8) * p.sway * 0.012;
    }

    ctx.save();
    ctx.translate(p.x + w/2 + swayX, p.y + h/2 + swayY);
    ctx.rotate((p.rotation * Math.PI/180) + swayR);
    ctx.drawImage(p.image, -w/2, -h/2, w, h);
    ctx.restore();

    if (p.id === selectedId) {
      ctx.save();
      ctx.translate(p.x+w/2, p.y+h/2);
      ctx.rotate(p.rotation*Math.PI/180);
      ctx.strokeStyle = "#d8b9ff";
      ctx.lineWidth = Math.max(1.5, stage.width/500);
      ctx.setLineDash([6,4]);
      ctx.strokeRect(-w/2,-h/2,w,h);
      ctx.restore();
    }
  }

  if (cropMode && pointerStart && pointerNow) {
    const x = Math.min(pointerStart.x,pointerNow.x);
    const y = Math.min(pointerStart.y,pointerNow.y);
    const w = Math.abs(pointerNow.x-pointerStart.x);
    const h = Math.abs(pointerNow.y-pointerStart.y);
    ctx.save();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = Math.max(2,stage.width/400);
    ctx.setLineDash([8,4]);
    ctx.strokeRect(x,y,w,h);
    ctx.fillStyle = "rgba(180,140,255,.18)";
    ctx.fillRect(x,y,w,h);
    ctx.restore();
  }
}

function frame(timestamp) {
  if (lastFrame) elapsed += Math.min(0.05,(timestamp-lastFrame)/1000);
  lastFrame = timestamp;
  if (state.animation) render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

$("saveProject").addEventListener("click", () => {
  if (!baseImageData) {
    say("保存する前に画像を読み込んでね。");
    return;
  }
  const project = {
    format:"MiniLive2DStudio",
    version:1,
    imageName:state.imageName,
    baseImageData,
    hideBase:state.hideBase,
    parts:parts.map(p => ({
      id:p.id,name:p.name,data:p.data,x:p.x,y:p.y,w:p.w,h:p.h,
      scale:p.scale,rotation:p.rotation,sway:p.sway,speed:p.speed,
      visible:p.visible,phase:p.phase
    }))
  };
  const blob = new Blob([JSON.stringify(project)], {type:"application/json"});
  downloadBlob(blob,"mini-live2d-project.json");
  say("制作データをJSONに書き出したよ。ファイルアプリなどに保存してね。");
});

$("loadProject").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const project = JSON.parse(await file.text());
    if (project.format !== "MiniLive2DStudio" ||
        !project.baseImageData || !Array.isArray(project.parts)) {
      throw new Error("このファイルは対応していない制作データだよ。");
    }
    await loadBaseData(project.baseImageData,project.imageName || "image.png");
    const loaded = await Promise.all(project.parts.map(async raw => {
      if (!raw.data) throw new Error("パーツ画像が見つからないよ。");
      const img = await readSourceImage(raw.data);
      return {
        id:Number(raw.id) || makeId(),
        name:String(raw.name || "パーツ"),
        data:raw.data,
        image:img,
        x:Number(raw.x)||0,y:Number(raw.y)||0,
        w:Number(raw.w)||img.naturalWidth,
        h:Number(raw.h)||img.naturalHeight,
        scale:Number(raw.scale)||1,
        rotation:Number(raw.rotation)||0,
        sway:Number(raw.sway)||0,
        speed:Number(raw.speed)||1,
        visible:raw.visible !== false,
        phase:Number(raw.phase)||0
      };
    }));
    parts = loaded;
    nextId = Math.max(0,...parts.map(p=>p.id))+1;
    selectedId = parts.length ? parts[0].id : null;
    state.hideBase = !!project.hideBase;
    $("hideBase").checked = state.hideBase;
    setCropMode(false);
    updatePartList();
    syncEditor();
    render();
    say("制作データを読み込んだよ。");
  } catch(err) {
    say("読み込みエラー：" + err.message);
  }
  e.target.value = "";
});

$("downloadImage").addEventListener("click", () => {
  if (!baseImageData) {
    say("先に画像を読み込んでね。");
    return;
  }
  render();
  stage.toBlob(blob => {
    if (!blob) {
      say("PNGを書き出せなかったよ。");
      return;
    }
    downloadBlob(blob,"mini-live2d-preview.png");
    say("現在の表示をPNGで書き出したよ。");
  },"image/png");
});

updatePartList();
render();
})();
</script>
</body>
</html>
