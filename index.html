
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Mini Blender VRM</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #20232a;
      color: white;
      font-family: sans-serif;
    }

    header {
      padding: 16px;
      background: #303640;
      font-size: 21px;
      font-weight: bold;
    }

    #toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px;
    }

    button,
    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #5267d9;
      color: white;
      font-size: 15px;
      cursor: pointer;
      touch-action: manipulation;
    }

    #file {
      display: block;
      width: 100%;
      padding: 8px;
      color: white;
      font-size: 14px;
    }

    #viewport {
      width: 100%;
      height: 60dvh;
      min-height: 320px;
      background: #17191f;
      overflow: hidden;
      touch-action: none;
    }

    #viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      padding: 14px;
      color: #cbd5e1;
      overflow-wrap: anywhere;
    }

    #help {
      padding: 0 14px 16px;
      color: #aebbd0;
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <header>Mini Blender VRM</header>

  <div id="toolbar">
    <label for="file" class="file-button">
      VRMを読み込む
    </label>

    <button id="rotate" type="button">
      カメラをリセット
    </button>

    <input id="file" type="file" accept=".vrm">
  </div>

  <div id="viewport"></div>

  <div id="status">
    VRMモデルを読み込んでください。
  </div>

  <div id="help">
    1本指：モデルを回転<br>
    2本指：拡大・縮小<br>
    カメラをリセット：最初の視点に戻す
  </div>

  <script type="module">
    import * as THREE from 'three';

    import { GLTFLoader } from
      'three/addons/loaders/GLTFLoader.js';

    import { OrbitControls } from
      'three/addons/controls/OrbitControls.js';

    import { VRMLoaderPlugin } from
      'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js';

    const viewport = document.querySelector('#viewport');
    const status = document.querySelector('#status');
    const fileInput = document.querySelector('#file');
    const resetButton = document.querySelector('#rotate');

    let currentVRM = null;
    let defaultCameraPosition = new THREE.Vector3(0, 1, 4);
    let modelCenter = new THREE.Vector3(0, 1, 0);
    let initialDistance = 4;

    try {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x252933);

      const camera = new THREE.PerspectiveCamera(
        35,
        viewport.clientWidth / viewport.clientHeight,
        0.01,
        1000
      );

      camera.position.copy(defaultCameraPosition);
      camera.lookAt(modelCenter);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false
      });

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
      );

      renderer.setSize(
        viewport.clientWidth,
        viewport.clientHeight
      );

      viewport.appendChild(renderer.domElement);

      // 照明
      scene.add(
        new THREE.HemisphereLight(
          0xffffff, 0x666677, 2
        )
      );

      const light = new THREE.DirectionalLight(
        0xffffff, 2
      );

      light.position.set(2, 4, 5);
      scene.add(light);

      // 床のグリッド
      const grid = new THREE.GridHelper(10, 20);
      scene.add(grid);

      // スマホ対応カメラ操作
      const controls = new OrbitControls(
        camera,
        renderer.domElement
      );

      controls.enableDamping = true;
      controls.dampingFactor = 0.08;

      controls.enableRotate = true;
      controls.enableZoom = true;
      controls.enablePan = false;

      controls.minDistance = 0.2;
      controls.maxDistance = 30;

      controls.target.copy(modelCenter);
      controls.update();
      controls.saveState();

      // VRMローダー
      const loader = new GLTFLoader();

      loader.register(
        parser => new VRMLoaderPlugin(parser)
      );

      status.textContent = '準備完了。VRMを選択してください。';

      fileInput.addEventListener('change', async () => {
        const file = fileInput.files?.[0];

        if (!file) {
          status.textContent = 'ファイルが選択されていません。';
          return;
        }

        let objectURL = null;
        let newVRM = null;

        status.textContent =
          '読み込み中：' + file.name;

        try {
          objectURL = URL.createObjectURL(file);

          const gltf = await loader.loadAsync(objectURL);
          newVRM = gltf.userData.vrm;

          if (!newVRM) {
            throw new Error(
              'VRMとして認識できません。VRMファイルを確認してください。'
            );
          }

          const newScene = newVRM.scene;

          scene.add(newScene);
          newScene.updateMatrixWorld(true);

          // モデル全体の範囲を取得
          const bounds = new THREE.Box3()
            .setFromObject(newScene);

          if (bounds.isEmpty()) {
            scene.remove(newScene);
            throw new Error(
              'モデルの形状を取得できませんでした。'
            );
          }

          const size = bounds.getSize(
            new THREE.Vector3()
          );

          modelCenter = bounds.getCenter(
            new THREE.Vector3()
          );

          const maxSize = Math.max(
            size.x, size.y, size.z
          );

          if (!Number.isFinite(maxSize) || maxSize <= 0) {
            scene.remove(newScene);
            throw new Error('モデルのサイズが不正です。');
          }

          // モデルが画面に収まるカメラ距離
          initialDistance =
            (maxSize / 2) /
            Math.tan(
              THREE.MathUtils.degToRad(
                camera.fov / 2
              )
            ) * 1.4;

          defaultCameraPosition.set(
            modelCenter.x,
            modelCenter.y,
            modelCenter.z + initialDistance
          );

          camera.position.copy(defaultCameraPosition);

          camera.near = Math.max(
            maxSize / 1000, 0.001
          );

          camera.far = Math.max(
            maxSize * 100, 100
          );

          camera.updateProjectionMatrix();

          controls.target.copy(modelCenter);
          controls.update();

          // 新しいモデルが表示できたあとで古いモデルを外す
          if (currentVRM) {
            scene.remove(currentVRM.scene);
          }

          currentVRM = newVRM;

          controls.target.copy(modelCenter);
          controls.update();
          controls.saveState();

          status.textContent =
            'VRM読み込み成功！ 指で回転・ズームできます。';

        } catch (error) {
          console.error('VRM読み込みエラー:', error);

          if (newVRM && newVRM !== currentVRM) {
            scene.remove(newVRM.scene);
          }

          status.textContent =
            '読み込み失敗：' +
            (error?.message || String(error));

        } finally {
          if (objectURL) {
            URL.revokeObjectURL(objectURL);
          }
        }
      });

      // カメラを初期状態に戻す
      resetButton.addEventListener('click', () => {
        controls.reset();

        status.textContent = currentVRM
          ? 'カメラをリセットしました。'
          : 'VRMモデルを読み込んでください。';
      });

      // 画面サイズの変化に対応
      function resize() {
        const width = viewport.clientWidth;
        const height = viewport.clientHeight;

        if (!width || !height) return;

        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
      }

      window.addEventListener('resize', resize);

      if ('ResizeObserver' in window) {
        new ResizeObserver(resize).observe(viewport);
      }

      // 描画ループ
      function animate() {
        requestAnimationFrame(animate);

        if (currentVRM) {
          currentVRM.update(1 / 60);
        }

        controls.update();
        renderer.render(scene, camera);
      }

      animate();

    } catch (error) {
      console.error('起動エラー:', error);

      status.textContent =
        '起動失敗：' +
        (error?.message || String(error));
    }
  </script>
</body>
</html>
