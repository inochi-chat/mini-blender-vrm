<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171923">
<title>Mini Blender VRM</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171923;color:#f4f5fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
button,input,select{font:inherit}
button{min-height:42px;padding:8px;border:1px solid #41485d;border-radius:10px;background:#2b3042;color:#f4f5fb;touch-action:manipulation}
button:disabled{opacity:.4}
button.active{background:#7c9cff;color:#101426}
button.primary{background:#344b87;border-color:#617fce}
button.danger{background:#592b38}
#app{height:100%;display:flex;flex-direction:column}
header{padding:9px 12px;background:#202332;border-bottom:1px solid #41485d;z-index:2}
.headerrow,.row{display:flex;gap:7px;align-items:stretch}
.headerrow{justify-content:space-between;align-items:center}
h1{font-size:17px;margin:0}
#status{margin-top:6px;font-size:12px;color:#b8d0ff;min-height:17px}
#workspace{flex:1;min-height:0;display:flex;flex-direction:column}
#viewport{position:relative;flex:1 1 48%;min-height:180px;overflow:hidden;background:#1b1e2b;touch-action:none}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
#viewHint{position:absolute;left:8px;bottom:8px;background:#121522bb;color:#d1d7e8;padding:5px 8px;border-radius:7px;font-size:11px;pointer-events:none}
#panel{flex:0 0 auto;height:49%;min-height:200px;overflow-y:auto;overscroll-behavior:contain;padding:10px;padding-bottom:max(18px,env(safe-area-inset-bottom));background:#171923;border-top:1px solid #41485d;-webkit-overflow-scrolling:touch}
.section{padding:10px;margin-bottom:10px;border:1px solid #41485d;border-radius:12px;background:#222533}
.section-title{font-size:14px;font-weight:700;margin-bottom:9px}
.row{margin-top:7px}
.row>button{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.small{margin-top:7px;color:#b8bfd1;font-size:12px;line-height:1.5}
#objectList{display:flex;flex-direction:column;gap:6px}
.object-item{display:flex;gap:7px;align-items:center}
.object-item button{flex:1;text-align:left;overflow-wrap:anywhere}
.object-item .mini-delete{flex:0 0 44px;text-align:center}
.object-item button.selected{border-color:#7c9cff;background:#35456f}
input[type=color]{width:100%;height:42px;border:1px solid #41485d;border-radius:9px;background:#2b3042;padding:3px}
select{min-width:0;flex:1;background:#2b3042;color:white;border:1px solid #41485d;border-radius:9px;padding:8px}
input[type=file]{display:none}
@media(orientation:landscape){
#workspace{flex-direction:row}
#viewport{flex:1 1 62%;height:100%;min-height:0}
#panel{flex:0 0 38%;height:100%;min-height:0;border-top:0;border-left:1px solid #41485d}
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js"
  }
}
</script>
</head>
<body>
<div id="app">
<header>
  <div class="headerrow">
    <h1>Mini Blender VRM</h1>
    <button id="undoButton" disabled>↶ 元に戻す</button>
  </div>
  <div id="status">準備中...</div>
</header>

<main id="workspace">
  <div id="viewport">
    <div id="viewHint">ドラッグ：回転 ／ 2本指：ズーム・移動</div>
  </div>

  <div id="panel">
    <section class="section">
      <div class="section-title">① 人型モデルを作る</div>
      <div class="row">
        <select id="bodyType" aria-label="体型">
          <option value="normal">標準体型</option>
          <option value="slim">細身</option>
          <option value="bighead">頭大きめ</option>
        </select>
        <input id="skinColor" type="color" value="#e8b99d" aria-label="肌色">
      </div>
      <div class="row">
        <input id="clothesColor" type="color" value="#657dcc" aria-label="服の色">
        <input id="pantsColor" type="color" value="#34394f" aria-label="ズボンの色">
      </div>
      <div class="row">
        <button id="createHuman" class="primary">人型モデルを作成</button>
      </div>
      <div class="small">
        頭・首・胴体・左右の腕・左右の脚を作るよ。
        生成した各パーツは、一覧から個別に選択して編集できるよ。
      </div>
    </section>

    <section class="section">
      <div class="section-title">② オブジェクト追加</div>
      <div class="row">
        <button id="addBox">＋ 箱</button>
        <button id="addSphere">＋ 球</button>
        <button id="addCylinder">＋ 円柱</button>
      </div>
    </section>

    <section class="section">
      <div class="section-title">③ 編集モード</div>
      <div class="grid">
        <button data-mode="object">オブジェクト</button>
        <button data-mode="vertex">頂点</button>
        <button data-mode="edge">辺</button>
        <button data-mode="face" class="active">面</button>
      </div>
      <div class="small">面は三角形単位で選択するよ。</div>
    </section>

    <section class="section">
      <div class="section-title">④ 移動・拡大縮小</div>
      <div class="row">
        <button id="moveXMinus">X −</button>
        <button id="moveXPlus">X ＋</button>
      </div>
      <div class="row">
        <button id="moveYMinus">Y −</button>
        <button id="moveYPlus">Y ＋</button>
      </div>
      <div class="row">
        <button id="moveZMinus">Z −</button>
        <button id="moveZPlus">Z ＋</button>
      </div>
      <div class="row">
        <button id="scaleDown">縮小</button>
        <button id="scaleUp">拡大</button>
      </div>
    </section>

    
    <section class="section">
      <div class="section-title">⑤ ポーズ編集・回転</div>
      <div class="row">
        <select id="rotationAngle" aria-label="回転角度">
          <option value="15">15° 回転</option>
          <option value="45" selected>45° 回転</option>
          <option value="90">90° 回転</option>
        </select>
        <button id="resetRotation">回転リセット</button>
      </div>
      <div class="small">一覧から頭・腕・脚などを選んでから操作してね。</div>
      <div class="row">
        <button id="rotXMinus">X − 回転</button>
        <button id="rotXPlus">X ＋ 回転</button>
      </div>
      <div class="row">
        <button id="rotYMinus">Y − 回転</button>
        <button id="rotYPlus">Y ＋ 回転</button>
      </div>
      <div class="row">
        <button id="rotZMinus">Z − 回転</button>
        <button id="rotZPlus">Z ＋ 回転</button>
      </div>
    </section>

    <section class="section">
      <div class="section-title">⑤ 面の加工</div>
      <div class="row">
        <button id="extrudeButton" class="primary">面を押し出す</button>
        <button id="subdivideButton">面を細分化</button>
      </div>
    </section>

    <section class="section">
      <div class="section-title">⑥ 色・削除・リセット</div>
      <div class="row">
        <input id="colorInput" type="color" value="#7c9cff" aria-label="変更する色">
        <button id="applyColor">色を適用</button>
        <button id="deleteObject" class="danger">削除</button>
      </div>
      <div class="row">
        <button id="resetTransform">変形をリセット</button>
        <button id="resetCamera">カメラをリセット</button>
      </div>
    </section>

    <section class="section">
      <div class="section-title">⑦ オブジェクト一覧</div>
      <div id="objectList"></div>
    </section>

    <section class="section">
      <div class="section-title">⑧ 参考イラスト</div>
      <input id="referenceImageInput" type="file" accept="image/*">
      <div class="row">
        <button id="loadReferenceImage" class="primary">写真から読み込む</button>
        <button id="toggleReferenceImage" disabled>画像を隠す</button>
      </div>
      <div class="row">
        <button id="removeReferenceImage" class="danger" disabled>画像を削除</button>
      </div>
      <div class="small">
        非表示にしても画像は保持されるよ。削除しても3Dモデルは消えないよ。
      </div>
    </section>
  </div>
</main>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = id => document.getElementById(id);
const viewport = $("viewport");
const statusEl = $("status");
const objectList = $("objectList");
const say = message => statusEl.textContent = message;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#1b1e2b");

const camera = new THREE.PerspectiveCamera(45,1,0.1,1000);
camera.position.set(6,5,9);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewport.prepend(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0,2,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x62647a,2));
const light = new THREE.DirectionalLight(0xffffff,2.2);
light.position.set(5,9,7);
scene.add(light);
scene.add(new THREE.GridHelper(20,20,0x77809b,0x41485d));
scene.add(new THREE.AxesHelper(2));

const helperGroup = new THREE.Group();
scene.add(helperGroup);

let objects = [];
let selectedObject = null;
let selectedComponent = null;
let mode = "face";
let nextObjectNumber = 1;
const history = [];
const MAX_HISTORY = 20;

/* ---------- 参考画像 ---------- */

let referenceSprite = null;
let referenceTexture = null;
let referenceObjectURL = null;
let referenceVisible = true;
let imageLoadToken = 0;

$("loadReferenceImage").addEventListener("click",()=>$("referenceImageInput").click());

$("referenceImageInput").addEventListener("change",event=>{
  const file = event.target.files?.[0];
  if(!file) return;

  if(!file.type.startsWith("image/")){
    say("画像ファイルを選んでね。");
    event.target.value="";
    return;
  }

  const token=++imageLoadToken;
  if(referenceObjectURL) URL.revokeObjectURL(referenceObjectURL);

  const url=URL.createObjectURL(file);
  referenceObjectURL=url;
  say("画像を読み込み中...");

  new THREE.TextureLoader().load(url,texture=>{
    if(token!==imageLoadToken){
      texture.dispose();
      return;
    }

    clearReferenceImage(false);

    referenceTexture=texture;
    texture.colorSpace=THREE.SRGBColorSpace;

    const image=texture.image;
    const aspect=image.width/image.height;
    const height=3.8;
    const width=Math.min(8,Math.max(.1,height*aspect));

    referenceSprite=new THREE.Sprite(new THREE.SpriteMaterial({
      map:texture,
      transparent:true,
      opacity:.72,
      depthTest:false,
      depthWrite:false,
      toneMapped:false
    }));

    referenceSprite.scale.set(width,height,1);
    referenceSprite.position.set(0,2,-1.5);
    referenceSprite.renderOrder=999;
    scene.add(referenceSprite);

    referenceVisible=true;
    $("toggleReferenceImage").disabled=false;
    $("toggleReferenceImage").textContent="画像を隠す";
    $("removeReferenceImage").disabled=false;
    say("参考画像を読み込んだよ。");
  },undefined,error=>{
    if(token!==imageLoadToken) return;
    console.error(error);
    if(referenceObjectURL===url){
      URL.revokeObjectURL(url);
      referenceObjectURL=null;
    }
    say("画像を読み込めなかったよ。別の画像で試してね。");
  });
});

function clearReferenceImage(updateButtons=true){
  if(referenceSprite){
    scene.remove(referenceSprite);
    referenceSprite.material.map=null;
    referenceSprite.material.dispose();
    referenceSprite=null;
  }
  if(referenceTexture){
    referenceTexture.dispose();
    referenceTexture=null;
  }
  if(referenceObjectURL){
    URL.revokeObjectURL(referenceObjectURL);
    referenceObjectURL=null;
  }
  if(updateButtons){
    $("referenceImageInput").value="";
    $("toggleReferenceImage").disabled=true;
    $("removeReferenceImage").disabled=true;
    $("toggleReferenceImage").textContent="画像を隠す";
    referenceVisible=true;
  }
}

$("toggleReferenceImage").addEventListener("click",()=>{
  if(!referenceSprite){
    say("表示する画像がないよ。");
    return;
  }
  referenceVisible=!referenceVisible;
  referenceSprite.visible=referenceVisible;
  $("toggleReferenceImage").textContent=referenceVisible?"画像を隠す":"画像を表示";
  say(referenceVisible?"参考画像を表示したよ。":"参考画像を隠したよ。");
});

$("removeReferenceImage").addEventListener("click",()=>{
  imageLoadToken++;
  clearReferenceImage(true);
  say("参考画像だけを削除したよ。");
});

/* ---------- 形状データ ---------- */

function editableGeometry(geometry){
  if(geometry.index){
    const old=geometry;
    geometry=old.toNonIndexed();
    old.dispose();
  }
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();
  return geometry;
}

function makeMaterial(color){
  return new THREE.MeshStandardMaterial({
    color,
    roughness:.75,
    metalness:.02,
    side:THREE.DoubleSide
  });
}

function addPart(name,geometry,color,position){
  geometry=editableGeometry(geometry);
  const mesh=new THREE.Mesh(geometry,makeMaterial(color));
  mesh.name=name;
  mesh.position.set(position[0],position[1],position[2]);
  objects.push(mesh);
  scene.add(mesh);
  return mesh;
}

function addPrimitive(type){
  saveHistory();
  let geometry,label;

  if(type==="box"){
    geometry=new THREE.BoxGeometry(1.5,1.5,1.5);
    label="箱";
  }else if(type==="sphere"){
    geometry=new THREE.SphereGeometry(.85,16,12);
    label="球";
  }else{
    geometry=new THREE.CylinderGeometry(.65,.65,1.6,16);
    label="円柱";
  }

  const mesh=addPart(
    label+" "+nextObjectNumber++,
    geometry,$("colorInput").value,
    [(objects.length%3)*1.8,.8,Math.floor(objects.length/3)*1.8]
  );
  selectObject(mesh);
  say(mesh.name+"を追加したよ。");
}

$("addBox").addEventListener("click",()=>addPrimitive("box"));
$("addSphere").addEventListener("click",()=>addPrimitive("sphere"));
$("addCylinder").addEventListener("click",()=>addPrimitive("cylinder"));

/* ---------- 人型モデル生成 ---------- */

function createHuman(){
  const type=$("bodyType").value;
  const skin=$("skinColor").value;
  const clothes=$("clothesColor").value;
  const pants=$("pantsColor").value;

  const slim=type==="slim";
  const bigHead=type==="bighead";

  const sx = slim ? 0.82 : 1;
  const headScale=bigHead?1.3:1;

  // 既存オブジェクトを残し、Undoで一括復元できるようにする
  saveHistory();

  const start=objects.length;
  const n=nextObjectNumber;

  // 座標のYが高さ。正面はZ方向。
  addPart("人型"+n+"・胴体",
    new THREE.BoxGeometry(.92*sx,1.25,.48),
    clothes,[0,2.65,0]);

  addPart("人型"+n+"・首",
    new THREE.CylinderGeometry(.16,.18,.3,12),
    skin,[0,3.43,0]);

  addPart("人型"+n+"・頭",
    new THREE.SphereGeometry(.39*headScale,20,16),
    skin,[0,3.95,0]);

  // 腕：円柱は初期状態でY方向。Z軸を回して斜めにする。
  const armL=addPart("人型"+n+"・左腕",
    new THREE.CylinderGeometry(.13,.17,.95,12),
    skin,[-.68,2.72,0]);
  armL.rotation.z=-.18;

  const armR=addPart("人型"+n+"・右腕",
    new THREE.CylinderGeometry(.13,.17,.95,12),
    skin,[.68,2.72,0]);
  armR.rotation.z=.18;

  addPart("人型"+n+"・左脚",
    new THREE.CylinderGeometry(.19,.16,1.15,12),
    pants,[-.25,1.35,0]);

  addPart("人型"+n+"・右脚",
    new THREE.CylinderGeometry(.19,.16,1.15,12),
    pants,[.25,1.35,0]);

  addPart("人型"+n+"・左足",
    new THREE.BoxGeometry(.3,.2,.52),
    pants,[-.25,.77,.12]);

  addPart("人型"+n+"・右足",
    new THREE.BoxGeometry(.3,.2,.52),
    pants,[.25,.77,.12]);

  nextObjectNumber++;

  selectedObject=objects[start];
  selectedComponent=null;

  updateObjectList();
  updateHelpers();

  controls.target.set(0,2.25,0);
  camera.position.set(5,4.5,8);
  controls.update();

  say("人型モデルを作成したよ！ 一覧から各パーツを選べるよ。");
}

$("createHuman").addEventListener("click",createHuman);

/* ---------- Undo ---------- */

function snapshotState(){
  return {
    objects:objects.map(mesh=>({
      name:mesh.name,
      geometry:mesh.geometry.clone(),
      position:mesh.position.clone(),
      rotation:mesh.rotation.clone(),
      scale:mesh.scale.clone(),
      color:mesh.material.color.getHex(),
      selected:mesh===selectedObject
    })),
    nextObjectNumber
  };
}

function disposeSnapshot(snapshot){
  snapshot.objects.forEach(item=>item.geometry.dispose());
}

function saveHistory(){
  history.push(snapshotState());
  while(history.length>MAX_HISTORY){
    disposeSnapshot(history.shift());
  }
  $("undoButton").disabled=history.length===0;
}

function undo(){
  if(!history.length){
    say("元に戻せる操作がないよ。");
    return;
  }

  const snapshot=history.pop();

  for(const mesh of objects){
    scene.remove(mesh);
    mesh.geometry.dispose();
    mesh.material.dispose();
  }

  objects=[];
  selectedObject=null;
  selectedComponent=null;

  for(const item of snapshot.objects){
    const mesh=new THREE.Mesh(
      item.geometry.clone(),
      makeMaterial(item.color)
    );
    mesh.name=item.name;
    mesh.position.copy(item.position);
    mesh.rotation.copy(item.rotation);
    mesh.scale.copy(item.scale);
    objects.push(mesh);
    scene.add(mesh);
    if(item.selected) selectedObject=mesh;
  }

  nextObjectNumber=snapshot.nextObjectNumber;
  disposeSnapshot(snapshot);

  clearHelpers();
  updateObjectList();
  updateHelpers();
  $("undoButton").disabled=history.length===0;
  say("1つ前の状態に戻したよ。");
}

$("undoButton").addEventListener("click",undo);

/* ---------- オブジェクト一覧 ---------- */

function selectObject(mesh){
  if(!mesh||!objects.includes(mesh)) return;
  selectedObject=mesh;
  selectedComponent=null;
  updateObjectList();
  updateHelpers();
  say(mesh.name+"を選択したよ。");
}

function updateObjectList(){
  objectList.replaceChildren();

  for(const mesh of objects){
    const row=document.createElement("div");
    row.className="object-item";

    const choose=document.createElement("button");
    choose.textContent=mesh.name;
    if(mesh===selectedObject) choose.classList.add("selected");
    choose.addEventListener("click",()=>selectObject(mesh));

    const remove=document.createElement("button");
    remove.className="mini-delete danger";
    remove.textContent="削除";
    remove.addEventListener("click",()=>{
      if(mesh===selectedObject){
        deleteSelectedObject();
      }else{
        saveHistory();
        scene.remove(mesh);
        mesh.geometry.dispose();
        mesh.material.dispose();
        objects=objects.filter(item=>item!==mesh);
        updateObjectList();
        say(mesh.name+"を削除したよ。");
      }
    });

    row.append(choose,remove);
    objectList.append(row);
  }
}

/* ---------- モード ---------- */

function setMode(newMode){
  mode=newMode;
  selectedComponent=null;
  document.querySelectorAll("[data-mode]").forEach(button=>{
    button.classList.toggle("active",button.dataset.mode===mode);
  });
  updateHelpers();
  say("編集モード："+({
    object:"オブジェクト",
    vertex:"頂点",
    edge:"辺",
    face:"面"
  })[mode]);
}

document.querySelectorAll("[data-mode]").forEach(button=>{
  button.addEventListener("click",()=>setMode(button.dataset.mode));
});

/* ---------- 選択ハイライト ---------- */

function clearHelpers(){
  while(helperGroup.children.length){
    const child=helperGroup.children[0];
    helperGroup.remove(child);
    if(child.geometry) child.geometry.dispose();
    if(child.material){
      if(Array.isArray(child.material)){
        child.material.forEach(m=>m.dispose());
      }else child.material.dispose();
    }
  }
}

function addLine(points,color=0xffd54a){
  const geometry=new THREE.BufferGeometry().setFromPoints(points);
  const material=new THREE.LineBasicMaterial({color,depthTest:false});
  const line=new THREE.Line(geometry,material);
  line.renderOrder=1001;
  helperGroup.add(line);
}

function addMarker(point){
  const marker=new THREE.Mesh(
    new THREE.SphereGeometry(.055,8,6),
    new THREE.MeshBasicMaterial({color:0xffd54a,depthTest:false})
  );
  marker.position.copy(point);
  marker.renderOrder=1002;
  helperGroup.add(marker);
}

function updateHelpers(){
  clearHelpers();
  if(!selectedObject) return;

  if(mode==="object"){
    const box=new THREE.BoxHelper(selectedObject,0xffd54a);
    box.renderOrder=1000;
    helperGroup.add(box);
    return;
  }

  if(!selectedComponent) return;

  const points=selectedComponent.points.map(p=>
    selectedObject.localToWorld(p.clone())
  );

  if(mode==="vertex") addMarker(points[0]);

  if(mode==="edge"){
    addLine(points);
    points.forEach(addMarker);
  }

  if(mode==="face"){
    addLine([points[0],points[1],points[1],points[2],points[2],points[0]]);
    points.forEach(addMarker);
  }
}

/* ---------- 3D画面の選択 ---------- */

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener("click",event=>{
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);

  const hits=raycaster.intersectObjects(objects,false);
  if(!hits.length) return;

  const hit=hits[0];
  if(mode==="object"){
    selectObject(hit.object);
    return;
  }
  if(!hit.face||hit.faceIndex==null) return;

  if(hit.object!==selectedObject){
    selectedObject=hit.object;
    selectedComponent=null;
    updateObjectList();
  }

  const pos=hit.object.geometry.getAttribute("position");
  const base=hit.faceIndex*3;
  if(base+2>=pos.count) return;

  const a=new THREE.Vector3().fromBufferAttribute(pos,base);
  const b=new THREE.Vector3().fromBufferAttribute(pos,base+1);
  const c=new THREE.Vector3().fromBufferAttribute(pos,base+2);

  if(mode==="face"){
    selectedComponent={type:"face",faceIndex:hit.faceIndex,points:[a,b,c]};
  }else if(mode==="vertex"){
    const candidates=[a,b,c];
    candidates.sort((p,q)=>
      hit.object.localToWorld(p.clone()).distanceTo(hit.point)-
      hit.object.localToWorld(q.clone()).distanceTo(hit.point)
    );
    selectedComponent={type:"vertex",points:[candidates[0]]};
  }else if(mode==="edge"){
    const edges=[[a,b],[b,c],[c,a]];
    let best=edges[0],bestDistance=Infinity;
    for(const edge of edges){
      const wa=hit.object.localToWorld(edge[0].clone());
      const wb=hit.object.localToWorld(edge[1].clone());
      const line=new THREE.Line3(wa,wb);
      const closest=line.closestPointToPoint(hit.point,true,new THREE.Vector3());
      const distance=closest.distanceTo(hit.point);
      if(distance<bestDistance){bestDistance=distance;best=edge;}
    }
    selectedComponent={type:"edge",points:best};
  }

  updateHelpers();
  say("選択したよ。");
});

/* ---------- 部分移動・拡大縮小 ---------- */

function samePoint(a,b){
  return a.distanceToSquared(b)<.00000001;
}

function moveSelection(axis,amount){
  if(!selectedObject){say("先にオブジェクトを選んでね。");return;}
  saveHistory();

  if(mode==="object"||!selectedComponent){
    selectedObject.position[axis]+=amount;
  }else{
    const geometry=selectedObject.geometry;
    const pos=geometry.getAttribute("position");
    const targets=selectedComponent.points;

    for(let i=0;i<pos.count;i++){
      const p=new THREE.Vector3().fromBufferAttribute(pos,i);
      if(targets.some(target=>samePoint(p,target))){
        p[axis]+=amount;
        pos.setXYZ(i,p.x,p.y,p.z);
      }
    }

    pos.needsUpdate=true;
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    geometry.computeBoundingSphere();
    targets.forEach(p=>p[axis]+=amount);
  }

  updateHelpers();
  say("選択部分を移動したよ。");
}

function scaleSelection(factor){
  if(!selectedObject){say("先にオブジェクトを選んでね。");return;}
  saveHistory();

  if(mode==="object"||!selectedComponent){
    selectedObject.scale.multiplyScalar(factor);
  }else{
    const geometry=selectedObject.geometry;
    const pos=geometry.getAttribute("position");
    const targets=selectedComponent.points;
    const center=new THREE.Vector3();
    targets.forEach(p=>center.add(p));
    center.divideScalar(targets.length);

    for(let i=0;i<pos.count;i++){
      const p=new THREE.Vector3().fromBufferAttribute(pos,i);
      if(targets.some(target=>samePoint(p,target))){
        p.sub(center).multiplyScalar(factor).add(center);
        pos.setXYZ(i,p.x,p.y,p.z);
      }
    }

    pos.needsUpdate=true;
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    geometry.computeBoundingSphere();

    selectedComponent.points=targets.map(p=>
      p.clone().sub(center).multiplyScalar(factor).add(center)
    );
  }

  updateHelpers();
  say("拡大縮小したよ。");
}

[
  ["moveXMinus","x",-.2],["moveXPlus","x",.2],
  ["moveYMinus","y",-.2],["moveYPlus","y",.2],
  ["moveZMinus","z",-.2],["moveZPlus","z",.2]
].forEach(([id,axis,amount])=>
  $(id).addEventListener("click",()=>moveSelection(axis,amount))
);

$("scaleDown").addEventListener("click",()=>scaleSelection(.9));
$("scaleUp").addEventListener("click",()=>scaleSelection(1.1));

  
/* ---------- ポーズ編集・回転 ---------- */

function rotateSelection(axis, direction) {
  if (!selectedObject) {
    say("先に一覧からパーツを選んでね。");
    return;
  }

  const degrees = Number($("rotationAngle").value);
  const radians = THREE.MathUtils.degToRad(degrees);

  saveHistory();

  selectedObject.rotation[axis] += radians * direction;

  updateHelpers();
  say(selectedObject.name + "を" + axis.toUpperCase() +
      "軸に" + (direction > 0 ? "+" : "-") +
      degrees + "°回転したよ。");
}

[
  ["rotXMinus", "x", -1],
  ["rotXPlus",  "x",  1],
  ["rotYMinus", "y", -1],
  ["rotYPlus",  "y",  1],
  ["rotZMinus", "z", -1],
  ["rotZPlus",  "z",  1]
].forEach(([id, axis, direction]) => {
  $(id).addEventListener("click", () => {
    rotateSelection(axis, direction);
  });
});

$("resetRotation").addEventListener("click", () => {
  if (!selectedObject) {
    say("先に一覧からパーツを選んでね。");
    return;
  }

  saveHistory();
  selectedObject.rotation.set(0, 0, 0);

  updateHelpers();
  say(selectedObject.name + "の回転をリセットしたよ。");
});

/* ---------- ジオメトリ加工 ---------- */

function geometryTriangles(geometry){
  const pos=geometry.getAttribute("position");
  const result=[];
  for(let i=0;i+2<pos.count;i+=3){
    result.push([
      new THREE.Vector3().fromBufferAttribute(pos,i),
      new THREE.Vector3().fromBufferAttribute(pos,i+1),
      new THREE.Vector3().fromBufferAttribute(pos,i+2)
    ]);
  }
  return result;
}

function trianglesToGeometry(triangles){
  const values=[];
  triangles.forEach(tri=>tri.forEach(p=>values.push(p.x,p.y,p.z)));
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute("position",new THREE.Float32BufferAttribute(values,3));
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();
  return geometry;
}

function requireFace(){
  if(!selectedObject||mode!=="face"||!selectedComponent||selectedComponent.type!=="face"){
    say("面モードにして、3D画面の面を選んでね。");
    return false;
  }
  return true;
}

$("extrudeButton").addEventListener("click",()=>{
  if(!requireFace()) return;
  const mesh=selectedObject;
  const index=selectedComponent.faceIndex;
  const triangles=geometryTriangles(mesh.geometry);
  if(!triangles[index]){say("面を選び直してね。");return;}

  saveHistory();

  const [a,b,c]=triangles[index].map(p=>p.clone());
  const normal=new THREE.Vector3().subVectors(b,a)
    .cross(new THREE.Vector3().subVectors(c,a)).normalize();
  const distance=.5;
  const a2=a.clone().addScaledVector(normal,distance);
  const b2=b.clone().addScaledVector(normal,distance);
  const c2=c.clone().addScaledVector(normal,distance);

  const result=triangles.filter((t,i)=>i!==index);
  const newIndex=result.length;
  result.push([a2,b2,c2]);
  result.push([a,b,b2],[a,b2,a2],[b,c,c2],[b,c2,b2],[c,a,a2],[c,a2,c2]);

  const old=mesh.geometry;
  mesh.geometry=trianglesToGeometry(result);
  old.dispose();

  selectedComponent={type:"face",faceIndex:newIndex,points:[a2,b2,c2]};
  updateHelpers();
  say("面を押し出したよ。");
});

$("subdivideButton").addEventListener("click",()=>{
  if(!requireFace()) return;
  const mesh=selectedObject;
  const index=selectedComponent.faceIndex;
  const triangles=geometryTriangles(mesh.geometry);
  if(!triangles[index]){say("面を選び直してね。");return;}

  saveHistory();

  const [a,b,c]=triangles[index].map(p=>p.clone());
  const ab=a.clone().add(b).multiplyScalar(.5);
  const bc=b.clone().add(c).multiplyScalar(.5);
  const ca=c.clone().add(a).multiplyScalar(.5);

  const result=triangles.filter((t,i)=>i!==index);
  const newIndex=result.length;
  result.push([a,ab,ca],[ab,b,bc],[ca,bc,c],[ab,bc,ca]);

  const old=mesh.geometry;
  mesh.geometry=trianglesToGeometry(result);
  old.dispose();

  selectedComponent={type:"face",faceIndex:newIndex,points:[a,ab,ca]};
  updateHelpers();
  say("面を4つに細分化したよ。");
});

/* ---------- 色・削除・リセット ---------- */

$("applyColor").addEventListener("click",()=>{
  if(!selectedObject){say("色を変更するパーツを選んでね。");return;}
  saveHistory();
  selectedObject.material.color.set($("colorInput").value);
  say("色を変更したよ。");
});

function deleteSelectedObject(){
  if(!selectedObject){say("削除するパーツを選んでね。");return;}
  saveHistory();

  const removed=selectedObject;
  scene.remove(removed);
  removed.geometry.dispose();
  removed.material.dispose();

  objects=objects.filter(mesh=>mesh!==removed);
  selectedObject=null;
  selectedComponent=null;

  clearHelpers();
  updateObjectList();
  say("選択したパーツを削除したよ。");
}

$("deleteObject").addEventListener("click",deleteSelectedObject);

$("resetTransform").addEventListener("click",()=>{
  if(!selectedObject){say("先にオブジェクトを選んでね。");return;}
  saveHistory();
  selectedObject.position.set(0,.8,0);
  selectedObject.rotation.set(0,0,0);
  selectedObject.scale.set(1,1,1);
  updateHelpers();
  say("変形をリセットしたよ。");
});

$("resetCamera").addEventListener("click",()=>{
  camera.position.set(6,5,9);
  controls.target.set(0,2,0);
  controls.update();
  say("カメラをリセットしたよ。");
});

/* ---------- 画面更新 ---------- */

function resize(){
  const width=Math.max(1,viewport.clientWidth);
  const height=Math.max(1,viewport.clientHeight);
  camera.aspect=width/height;
  camera.updateProjectionMatrix();
  renderer.setSize(width,height,false);
}

if("ResizeObserver" in window){
  new ResizeObserver(resize).observe(viewport);
}else{
  window.addEventListener("resize",resize);
}

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  helperGroup.children.forEach(child=>{
    if(child.isBoxHelper) child.update();
  });
  renderer.render(scene,camera);
}

resize();
addPrimitive("box");
setMode("face");
history.length=0;
$("undoButton").disabled=true;
animate();
say("準備完了！ 人型モデルを作成できるよ。");
</script>
