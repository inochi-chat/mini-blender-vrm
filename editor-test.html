
<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mini 3D Studio - Test</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #171923;
  color: #f5f5f5;
  font-family: sans-serif;
}

header {
  padding: 14px;
  background: #242736;
  font-weight: bold;
}

#viewport {
  width: 100%;
  height: 48vh;
  min-height: 280px;
  position: relative;
  overflow: hidden;
  background: #202431;
}

#viewport canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

main { padding: 12px; }

h2 {
  font-size: 15px;
  margin: 16px 0 9px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 13px 5px;
  background: #343b50;
  color: white;
  font-size: 14px;
  touch-action: manipulation;
}

button:active { background: #5669a1; }

button.primary { background: #536fe0; }
button.danger { background: #8d394b; }

#status {
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  background: #242736;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.note {
  color: #c0c4d2;
  font-size: 12px;
  line-height: 1.7;
}
</style>
</head>

<body>
<header>Mini 3D Studio - 開発テスト</header>

<div id="viewport"></div>

<main>
  <h2>オブジェクトを追加</h2>
  <div class="buttons">
    <button class="primary" id="addBox">立方体</button>
    <button class="primary" id="addSphere">球</button>
    <button class="primary" id="addCylinder">円柱</button>
  </div>

  <h2>選択したオブジェクトを移動</h2>
  <div class="buttons">
    <button data-move="x" data-value="-0.2">X −</button>
    <button data-move="y" data-value="0.2">Y ＋</button>
    <button data-move="x" data-value="0.2">X ＋</button>
    <button data-move="y" data-value="-0.2">Y −</button>
    <button data-move="z" data-value="0.2">Z ＋</button>
    <button data-move="z" data-value="-0.2">Z −</button>
  </div>

  <h2>大きさを変更</h2>
  <div class="buttons">
    <button id="scaleDown">小さくする</button>
    <button id="scaleUp">大きくする</button>
    <button id="resetTransform">位置・大きさリセット</button>
  </div>

  <h2>削除</h2>
  <div class="buttons">
    <button class="danger" id="deleteObject">選択物を削除</button>
  </div>

  <div id="status">準備中...</div>

  <p class="note">
    画面をドラッグ：カメラ回転<br>
    オブジェクトをタップ：選択<br>
    ※この段階では編集対象は基本図形です。
    頂点・辺・面の編集機能は次の段階で追加します。
  </p>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const viewport = document.getElementById('viewport');
const status = document.getElementById('status');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202431);

const camera = new THREE.PerspectiveCamera(
  45, 1, 0.1, 1000
);
camera.position.set(4, 3, 6);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewport.appendChild(renderer.domElement);

const controls = new OrbitControls(
  camera, renderer.domElement
);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(
  0xffffff, 0x596070, 2
));

const light = new THREE.DirectionalLight(
  0xffffff, 2
);
light.position.set(4, 8, 5);
scene.add(light);

const grid = new THREE.GridHelper(
  20, 20, 0x727b9c, 0x42495d
);
scene.add(grid);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshBasicMaterial({
    color: 0x202431,
    side: THREE.DoubleSide
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.015;
scene.add(floor);

const objects = [];
let selected = null;
let nextId = 1;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

const selectionMaterial = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  wireframe: true,
  transparent: true,
  opacity: 0.85,
  depthTest: false
});

let selectionWire = null;

function resize() {
  const width = viewport.clientWidth;
  const height = viewport.clientHeight;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
}

window.addEventListener('resize', resize);
resize();

function updateStatus(message = '') {
  const selectedText = selected
    ? `選択中：${selected.userData.label}`
    : '選択中：なし';

  status.textContent =
    `${selectedText} / オブジェクト数：${objects.length}` +
    (message ? ` / ${message}` : '');
}

function selectObject(object) {
  selected = object;

  if (selectionWire) {
    scene.remove(selectionWire);
    selectionWire.geometry.dispose();
    selectionWire = null;
  }

  if (selected) {
    selectionWire = new THREE.Mesh(
      selected.geometry,
      selectionMaterial
    );
    selectionWire.position.copy(selected.position);
    selectionWire.rotation.copy(selected.rotation);
    selectionWire.scale.copy(selected.scale);
    selectionWire.renderOrder = 10;
    scene.add(selectionWire);
  }

  updateStatus();
}

function addObject(type) {
  let geometry;
  let label;

  if (type === 'box') {
    geometry = new THREE.BoxGeometry(1, 1, 1);
    label = '立方体';
  } else if (type === 'sphere') {
    geometry = new THREE.SphereGeometry(0.65, 24, 16);
    label = '球';
  } else {
    geometry = new THREE.CylinderGeometry(
      0.5, 0.5, 1.2, 24
    );
    label = '円柱';
  }

  const material = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(
      Math.random(), 0.65, 0.58
    ),
    roughness: 0.7
  });

  const object = new THREE.Mesh(geometry, material);

  object.position.set(
    (Math.random() - 0.5) * 1.5,
    1,
    (Math.random() - 0.5) * 1.5
  );

  object.userData.id = nextId++;
  object.userData.label = `${label} ${object.userData.id}`;

  scene.add(object);
  objects.push(object);
  selectObject(object);
}

document.getElementById('addBox').onclick =
  () => addObject('box');

document.getElementById('addSphere').onclick =
  () => addObject('sphere');

document.getElementById('addCylinder').onclick =
  () => addObject('cylinder');

document.querySelectorAll('[data-move]').forEach(button => {
  button.addEventListener('click', () => {
    if (!selected) {
      updateStatus('先にオブジェクトを選択してね');
      return;
    }

    const axis = button.dataset.move;
    const amount = Number(button.dataset.value);

    selected.position[axis] += amount;
    updateStatus('移動しました');
  });
});

document.getElementById('scaleUp').onclick = () => {
  if (!selected) {
    updateStatus('先にオブジェクトを選択してね');
    return;
  }

  selected.scale.multiplyScalar(1.15);
  updateStatus('拡大しました');
};

document.getElementById('scaleDown').onclick = () => {
  if (!selected) {
    updateStatus('先にオブジェクトを選択してね');
    return;
  }

  selected.scale.multiplyScalar(0.87);
  updateStatus('縮小しました');
};

document.getElementById('resetTransform').onclick = () => {
  if (!selected) {
    updateStatus('先にオブジェクトを選択してね');
    return;
  }

  selected.position.set(0, 1, 0);
  selected.rotation.set(0, 0, 0);
  selected.scale.set(1, 1, 1);
  updateStatus('リセットしました');
};

document.getElementById('deleteObject').onclick = () => {
  if (!selected) {
    updateStatus('削除する物を選択してね');
    return;
  }

  const index = objects.indexOf(selected);

  scene.remove(selected);

  selected.geometry.dispose();

  if (Array.isArray(selected.material)) {
    selected.material.forEach(material => material.dispose());
  } else {
    selected.material.dispose();
  }

  if (index !== -1) objects.splice(index, 1);

  selectObject(null);
  updateStatus('削除しました');
};

// ドラッグとタップを区別して選択する
let pointerStart = null;

renderer.domElement.addEventListener('pointerdown', event => {
  if (event.isPrimary === false) return;

  pointerStart = {
    x: event.clientX,
    y: event.clientY
  };
});

renderer.domElement.addEventListener('pointerup', event => {
  if (!pointerStart || event.isPrimary === false) return;

  const dx = event.clientX - pointerStart.x;
  const dy = event.clientY - pointerStart.y;
  pointerStart = null;

  // カメラを動かした場合は選択判定しない
  if (Math.hypot(dx, dy) > 8) return;

  const rect = renderer.domElement.getBoundingClientRect();

  pointer.x =
    ((event.clientX - rect.left) / rect.width) * 2 - 1;

  pointer.y =
    -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObjects(objects, false);

  if (hits.length) {
    selectObject(hits[0].object);
  }
});

function animate() {
  requestAnimationFrame(animate);

  controls.update();

  if (selectionWire && selected) {
    selectionWire.position.copy(selected.position);
    selectionWire.rotation.copy(selected.rotation);
    selectionWire.scale.copy(selected.scale);
  }

  renderer.render(scene, camera);
}

addObject('box');
updateStatus('準備完了');
animate();
</script>
</body>
</html>
